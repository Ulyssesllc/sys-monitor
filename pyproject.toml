[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sys-monitor"
version = "0.1.0"
description = "System Health & Performance Monitoring CLI Tool"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas","matplotlib","psutil",]

[project.scripts]
sys-monitor = "main:main"

[tool.setuptools]
py-modules = ["main","collector","visualize"]

[tool.setuptools.packages.find]
exclude = ["reports*","tests*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]

